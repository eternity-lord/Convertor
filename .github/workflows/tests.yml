name: Tests
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app main.py
      - name: Unit and GUI regression tests
        run: |
          set +e
          python -m pytest -q > /tmp/edius-pytest.log 2>&1
          status=$?
          cat /tmp/edius-pytest.log
          if [ "$status" -ne 0 ]; then
            python - <<'PYLOG'
          from pathlib import Path
          text = Path('/tmp/edius-pytest.log').read_text(errors='replace')[-10000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Regression test diagnostics::' + text)
          PYLOG
          fi
          exit "$status"
